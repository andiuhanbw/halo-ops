name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate compose
        run: docker compose --env-file .env.example config -q

      - name: Validate nginx
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          echo "127.0.0.1 halo" | sudo tee -a /etc/hosts
          sudo cp nginx/default.conf /etc/nginx/conf.d/default.conf
          sudo rm -f /etc/nginx/sites-enabled/default
          sudo nginx -t

      - name: Validate Prometheus rules
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus
          sudo systemctl stop prometheus || true
          promtool check rules prometheus/rules/halo-alerts.yml

      - name: Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S error scripts/*.sh

  deploy:
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "${{ secrets.SSH_PRIVATE_KEY_B64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deploy key
        run: |
          test -s ~/.ssh/deploy_key
          grep -q 'BEGIN OPENSSH PRIVATE KEY' ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Upload release and deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          RELEASE="/opt/halo-ops/.deploy/releases/${GITHUB_SHA}"
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o StrictHostKeyChecking=yes"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "mkdir -p $RELEASE/nginx"

          scp $SSH_OPTS compose.yaml "$SSH_USER@$SSH_HOST:$RELEASE/compose.yaml"
          scp $SSH_OPTS nginx/default.conf "$SSH_USER@$SSH_HOST:$RELEASE/nginx/default.conf"
          scp $SSH_OPTS scripts/deploy.sh "$SSH_USER@$SSH_HOST:/opt/halo-ops/scripts/deploy.sh"

          ssh $SSH_OPTS "$SSH_USER@$SSH_HOST" "chmod +x /opt/halo-ops/scripts/deploy.sh && /opt/halo-ops/scripts/deploy.sh $RELEASE"
