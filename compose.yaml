name: halo-ops

services:
  halo:
    image: registry.fit2cloud.com/halo/halo:2.27.0
    restart: unless-stopped
    depends_on:
      halodb:
        condition: service_healthy
    ports:
      - "127.0.0.1:8090:8090"
    environment:
      TZ: Asia/Shanghai
      JVM_OPTS: "-Xmx256m -Xms256m"
    command:
      - --spring.r2dbc.url=r2dbc:pool:postgresql://halodb:5432/halo
      - --spring.r2dbc.username=halo
      - --spring.r2dbc.password=${POSTGRES_PASSWORD}
      - --spring.sql.init.platform=postgresql
      - --halo.external-url=${HALO_EXTERNAL_URL}
    volumes:
      - ./data/halo:/root/.halo2
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/actuator/health/readiness"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: 640m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - halo_net

  halodb:
    image: ${POSTGRES_IMAGE:-public.ecr.aws/docker/library/postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_DB: halo
      POSTGRES_USER: halo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=50
      - -c
      - effective_cache_size=256MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U halo -d halo"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 320m
    shm_size: 128mb
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - halo_net

  nginx:
    image: public.ecr.aws/docker/library/nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      halo:
        condition: service_healthy
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./data/nginx/logs:/var/log/nginx
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 64m
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    networks:
      - halo_net

volumes:
  pg_data:

networks:
  halo_net:
